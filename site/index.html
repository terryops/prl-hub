<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pearl Hub — Wallet &amp; Mining</title>
<meta name="description" content="Pearl Hub — a self-custody Pearl ($PRL) wallet and live mining monitor for iPhone, iPad and Mac.">
<style>
  :root { --indigo:#1B2A6B; --blue:#527AF2; --cyan:#8FC7FF; --ink:#0f1830; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         color:#eaf1ff; background:linear-gradient(180deg,var(--indigo) 0%,var(--blue) 60%,var(--cyan) 100%);
         min-height:100vh; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:720px; margin:0 auto; padding:64px 24px 80px; text-align:center; }
  img.logo { width:104px; height:104px; border-radius:24px; box-shadow:0 12px 40px rgba(10,20,60,.45); }
  h1 { font-size:40px; font-weight:800; margin:22px 0 6px; letter-spacing:-.5px; }
  .tag { font-size:18px; color:#dbe6ff; opacity:.95; margin:0 0 36px; }
  .cards { display:flex; gap:16px; justify-content:center; flex-wrap:wrap; }
  a.card { display:block; min-width:220px; padding:20px 24px; border-radius:16px; text-decoration:none;
           background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.22); color:#fff;
           backdrop-filter:blur(8px); transition:.15s; }
  a.card:hover { background:rgba(255,255,255,.2); transform:translateY(-2px); }
  a.card b { display:block; font-size:18px; margin-bottom:4px; }
  a.card span { font-size:14px; color:#dbe6ff; }
  .feat { margin:44px 0 0; color:#eaf1ff; opacity:.95; font-size:15px; }
  .feat span { display:inline-block; margin:4px 8px; padding:6px 12px; border-radius:999px;
               background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2); }
  footer { margin-top:48px; font-size:13px; color:#cdddff; opacity:.85; }
  a { color:#fff; }
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="/logo.png" alt="Pearl Hub">
    <h1>Pearl Hub</h1>
    <p class="tag">Your Pearl ($PRL) wallet &amp; mining monitor — all in one app.</p>

    <div class="cards">
      <a class="card" href="/support"><b>Support</b><span>Questions, help &amp; contact</span></a>
      <a class="card" href="/privacy"><b>Privacy Policy</b><span>How your data is handled</span></a>
    </div>

    <div class="feat">
      <span>Self-custody wallet</span>
      <span>Send &amp; receive $PRL</span>
      <span>Live mining monitor</span>
      <span>Profit calculator</span>
      <span>iPhone · iPad · Mac</span>
    </div>

    <footer>© 2026 Pearl Hub · Built for the Pearl ($PRL) community</footer>
  </div>
</body>
</html>
